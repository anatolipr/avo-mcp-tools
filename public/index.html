<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MCP Form</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f0;
    }
    mcp-form {
      background: white;
      padding: 2rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      min-width: 340px;
      max-width: 480px;
      width: 100%;
    }
  </style>
</head>
<body>
  <mcp-form></mcp-form>

  <script type="module">
    import { LitElement, html, css } from 'https://esm.sh/lit@3';
    import { unsafeHTML } from 'https://esm.sh/lit@3/directives/unsafe-html.js';

    class HtmlOutputBlock extends LitElement {
      static properties = {
        content: { type: String },
        scopedCss: { type: String, attribute: 'scoped-css' },
      };
      constructor() { super(); this.content = ''; this.scopedCss = ''; }
      render() {
        return html`
          ${this.scopedCss ? html`<style>${unsafeHTML(this.scopedCss)}</style>` : ''}
          ${unsafeHTML(this.content)}
        `;
      }
    }
    customElements.define('html-output-block', HtmlOutputBlock);

    class Signal {
      #value;
      #subs = new Set();
      constructor(initial) { this.#value = initial; }
      get() { return this.#value; }
      set(next) {
        if (next === this.#value) return;
        this.#value = next;
        for (const fn of this.#subs) fn(next);
      }
      subscribe(fn) { this.#subs.add(fn); return () => this.#subs.delete(fn); }
    }

    class McpForm extends LitElement {
      static styles = css`
        *, *::before, *::after { box-sizing: border-box; }

        :host { display: block; min-width: 0; width: 100%; }

        .title {
          font-size: 1.1rem;
          font-weight: 600;
          color: #1a1a1a;
          margin: 0 0 1.5rem;
          line-height: 1.4;
        }

        .field { margin-bottom: 1.1rem; min-width: 0; width: 100%; box-sizing: border-box; }

        html-output-block { display: block; margin-bottom: 1.1rem; }

        label {
          display: block;
          font-size: 0.78rem;
          font-weight: 500;
          color: #555;
          margin-bottom: 0.3rem;
          letter-spacing: 0.01em;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="datetime-local"],
        textarea,
        select {
          font-family: inherit;
          font-size: 0.95rem;
          padding: 0.5rem 0.7rem;
          border: 1px solid #ddd;
          border-radius: 6px;
          width: 100%;
          outline: none;
          background: #fff;
          color: #1a1a1a;
          transition: border-color 0.15s;
        }
        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        input[type="datetime-local"]:focus,
        textarea:focus,
        select:focus { border-color: #666; }

        textarea { resize: vertical; min-height: 80px; }

        .checkbox-row {
          display: flex;
          align-items: center;
          gap: 0.55rem;
          padding: 0.3rem 0;
        }
        .checkbox-row input[type="checkbox"] {
          width: 1.1rem;
          height: 1.1rem;
          margin: 0;
          cursor: pointer;
          accent-color: #1a1a1a;
          flex-shrink: 0;
        }
        .checkbox-row label {
          margin: 0;
          font-size: 0.9rem;
          font-weight: 400;
          color: #1a1a1a;
          cursor: pointer;
        }

        .radio-group {
          display: flex;
          flex-direction: column;
          gap: 0.45rem;
          padding: 0.1rem 0;
        }
        .radio-row {
          display: flex;
          align-items: center;
          gap: 0.55rem;
        }
        .radio-row input[type="radio"] {
          width: 1rem;
          height: 1rem;
          margin: 0;
          cursor: pointer;
          accent-color: #1a1a1a;
          flex-shrink: 0;
        }
        .radio-row label {
          margin: 0;
          font-size: 0.9rem;
          font-weight: 400;
          color: #1a1a1a;
          cursor: pointer;
        }

        .range-wrap {
          display: flex;
          align-items: center;
          gap: 0.75rem;
        }
        input[type="range"] {
          flex: 1;
          accent-color: #1a1a1a;
          cursor: pointer;
        }
        .range-value {
          font-size: 0.9rem;
          font-weight: 600;
          color: #1a1a1a;
          min-width: 2.5rem;
          text-align: right;
        }

        .multiselect-group {
          display: flex;
          flex-direction: column;
          gap: 0.45rem;
          padding: 0.1rem 0;
        }
        .multiselect-row {
          display: flex;
          align-items: center;
          gap: 0.55rem;
        }
        .multiselect-row input[type="checkbox"] {
          width: 1rem;
          height: 1rem;
          margin: 0;
          cursor: pointer;
          accent-color: #1a1a1a;
          flex-shrink: 0;
        }
        .multiselect-row label {
          margin: 0;
          font-size: 0.9rem;
          font-weight: 400;
          color: #1a1a1a;
          cursor: pointer;
        }

        .list-rows {
          display: flex;
          flex-direction: column;
          gap: 0.6rem;
          align-self: stretch;
          min-width: 0;
        }
        .list-card {
          display: flex;
          flex-direction: column;
          border: 1px solid #e0e0e0;
          border-radius: 8px;
          background: #fafafa;
          min-width: 0;
        }
        .list-card__header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0.6rem 0.6rem 0.6rem 0.9rem;
          border-bottom: 1px solid #ebebeb;
          min-height: 2.2rem;
        }
        .list-card__title {
          font-size: 0.72rem;
          font-weight: 600;
          color: #888;
          letter-spacing: 0.04em;
          text-transform: uppercase;
        }
        .list-card__body {
          padding: 0.75rem 0.9rem;
          display: flex;
          flex-direction: column;
          min-width: 0;
        }
        .list-card .field:last-child { margin-bottom: 0; }
        .list-card__remove {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 1.5rem;
          height: 1.5rem;
          padding: 0;
          flex-shrink: 0;
          border-radius: 50%;
          font-size: 0.75rem;
          font-weight: 700;
          line-height: 1;
          background: #e0e0e0;
          color: #555;
          border: none;
          cursor: pointer;
          transition: background 0.15s, color 0.15s;
        }
        .list-card__remove:hover:not(:disabled) { background: #e53e3e; color: #fff; }
        .list-card__remove:disabled { opacity: 0.35; cursor: not-allowed; }
        .list-add-btn {
          display: inline-flex;
          align-items: center;
          gap: 0.35rem;
          background: transparent;
          border: 1.5px dashed #bbb;
          color: #555;
          border-radius: 6px;
          padding: 0.4rem 0.85rem;
          font-size: 0.82rem;
          font-weight: 600;
          font-family: inherit;
          cursor: pointer;
          transition: border-color 0.15s, color 0.15s, background 0.15s;
          width: 100%;
          justify-content: center;
        }
        .list-add-btn:hover:not(:disabled) { border-color: #888; color: #1a1a1a; background: #f5f5f0; }
        .list-add-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .color-wrap {
          display: flex;
          align-items: center;
          gap: 0.65rem;
        }
        input[type="color"] {
          width: 2.5rem;
          height: 2.5rem;
          padding: 0.15rem;
          border: 1px solid #ddd;
          border-radius: 6px;
          cursor: pointer;
          background: #fff;
          flex-shrink: 0;
        }
        .color-hex {
          font-size: 0.9rem;
          font-family: monospace;
          color: #1a1a1a;
        }

        .file-drop {
          border: 2px dashed #ddd;
          border-radius: 8px;
          padding: 1.2rem 1rem;
          text-align: center;
          cursor: pointer;
          transition: border-color 0.15s, background 0.15s;
          position: relative;
        }
        .file-drop:hover:not(.file-drop--disabled) { border-color: #999; background: #fafafa; }
        .file-drop--over { border-color: #1a1a1a; background: #f0f0f0; }
        .file-drop--done { border-color: #4caf50; background: #f6fff6; cursor: default; }
        .file-drop--disabled { opacity: 0.5; cursor: not-allowed; }
        .file-drop input[type="file"] {
          position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
        }
        .file-drop--disabled input[type="file"] { pointer-events: none; }
        .file-drop__icon { font-size: 1.5rem; margin-bottom: 0.3rem; }
        .file-drop__prompt { font-size: 0.85rem; color: #666; }
        .file-drop__name { font-size: 0.85rem; font-weight: 600; color: #1a1a1a; margin-top: 0.2rem; }
        .file-drop__uploading { font-size: 0.78rem; color: #aaa; margin-top: 0.2rem; }

        .actions {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-top: 1.5rem;
          gap: 1rem;
        }

        button {
          font-family: inherit;
          font-size: 0.9rem;
          font-weight: 600;
          padding: 0.55rem 1.4rem;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          background: #1a1a1a;
          color: #fff;
          transition: opacity 0.15s, background 0.15s;
        }
        button:hover:not(:disabled) { background: #333; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-interrupt {
          background: transparent;
          border: 1.5px solid #bbb;
          color: #555;
          font-size: 0.82rem;
          padding: 0.4rem 0.9rem;
        }
        .btn-interrupt:hover:not(:disabled) { border-color: #888; color: #1a1a1a; background: #f5f5f0; }

        .field-error {
          font-size: 0.75rem;
          color: #d32f2f;
          margin-top: 0.25rem;
          font-weight: 500;
        }
        .input-error,
        .input-error:focus {
          border-color: #d32f2f !important;
        }
        .list-card.card-has-error {
          border-color: #f5c2c2;
          background: #fffafa;
        }

        .submitted-note {
          font-size: 0.78rem;
          color: #4caf50;
          font-weight: 500;
        }

        .status {
          font-size: 0.72rem;
          color: #aaa;
        }
        .dot {
          display: inline-block;
          width: 7px; height: 7px;
          border-radius: 50%;
          margin-right: 4px;
          background: #ccc;
          vertical-align: middle;
        }
        .dot.live { background: #4caf50; }
      `;

      static properties = {
        _title:     { state: true },
        _fields:    { state: true },
        _connected: { state: true },
        _submitted: { state: true },
        _errors:    { state: true },
      };

      constructor() {
        super();
        this._title     = '';
        this._fields    = [];
        this._signals   = new Map();
        this._connected = false;
        this._submitted = false;
        this._errors    = {};
        this._connect();
      }

      _connect() {
        const ws = new WebSocket(`ws://${location.host}/ws`);
        this._ws = ws;
        ws.onopen  = () => { this._connected = true; };
        ws.onclose = () => {
          this._connected = false;
          // simple reconnect after 2 s
          setTimeout(() => this._connect(), 2000);
        };
        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === 'init' || msg.type === 'reinit') {
            this._applyFormDef(msg.formDef, msg.state);
          }
          if (msg.type === 'update') {
            const signal = this._signals.get(msg.field);
            if (signal) signal.set(msg.value);
          }
        };
      }

      _applyFormDef(formDef, state) {
        this._title    = formDef.title ?? '';
        this._fields   = formDef.fields;
        this._submitted = false;
        this._errors   = {};
        this._signals  = new Map();
        this._fileState = new Map(); // name -> { status: 'idle'|'uploading'|'done'|'error', fileName }
        for (const f of this._fields) {
          if (f.type === 'html_output') continue;
          const signal = new Signal(state[f.name] ?? f.default ?? '');
          signal.subscribe(() => this.requestUpdate());
          this._signals.set(f.name, signal);
          if (f.type === 'file') this._fileState.set(f.name, { status: 'idle', fileName: '' });
        }
        this.requestUpdate();
      }

      _onInput(name, value, errorKey) {
        this._signals.get(name)?.set(value);
        this._ws.send(JSON.stringify({ type: 'set', field: name, value }));
        const key = errorKey ?? name;
        if (this._errors[key]) {
          const next = { ...this._errors };
          delete next[key];
          this._errors = next;
        }
      }

      _validateField(f, value) {
        if (f.required) {
          if (f.type === 'checkbox' && value !== 'true') return 'This field is required.';
          if (f.type === 'multiselect') {
            let arr; try { arr = JSON.parse(value || '[]'); } catch { arr = []; }
            if (!arr.length) return 'Please select at least one option.';
          } else if (!value || value.trim() === '') {
            return 'This field is required.';
          }
        }
        if (value && f.pattern) {
          try {
            if (!new RegExp(f.pattern).test(value))
              return f.patternMessage || 'Invalid format.';
          } catch { /* bad regex — skip */ }
        }
        if (value && (f.type === 'text' || f.type === 'textarea')) {
          if (f.minLength != null && value.length < f.minLength)
            return `Must be at least ${f.minLength} characters.`;
          if (f.maxLength != null && value.length > f.maxLength)
            return `Must be at most ${f.maxLength} characters.`;
        }
        if (value && f.type === 'number') {
          const num = Number(value);
          if (f.min != null && num < f.min) return `Must be at least ${f.min}.`;
          if (f.max != null && num > f.max) return `Must be at most ${f.max}.`;
        }
        return null;
      }

      _validate() {
        const errors = {};
        for (const f of this._fields) {
          if (f.type === 'html_output') continue;
          const value = this._signals.get(f.name)?.get() ?? '';
          if (f.type === 'list') {
            let rows; try { rows = JSON.parse(value || '[]'); } catch { rows = []; }
            if (f.required && !rows.some(r => Object.values(r).some(v => v && v.trim?.() !== '')))
              errors[f.name] = 'Please add at least one entry.';
            for (let i = 0; i < rows.length; i++) {
              for (const sf of (f.fields ?? [])) {
                const sv = rows[i][sf.name] ?? '';
                const msg = this._validateField(sf, sv);
                if (msg) errors[`${f.name}[${i}].${sf.name}`] = msg;
              }
            }
          } else {
            const msg = this._validateField(f, value);
            if (msg) errors[f.name] = msg;
          }
        }
        return errors;
      }

      async _uploadFile(name, file) {
        this._fileState.set(name, { status: 'uploading', fileName: file.name });
        this.requestUpdate();

        try {
          const fd = new FormData();
          fd.append('file', file);
          const res = await fetch('/upload', { method: 'POST', body: fd });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const { path } = await res.json();
          this._fileState.set(name, { status: 'done', fileName: file.name });
          this._onInput(name, path);
        } catch (err) {
          this._fileState.set(name, { status: 'error', fileName: file.name });
        }
        this.requestUpdate();
      }

      _onSubmit() {
        const errors = this._validate();
        if (Object.keys(errors).length) {
          this._errors = errors;
          return;
        }
        this._submitted = true;
        this._ws.send(JSON.stringify({ type: 'submit' }));
      }

      _onInterrupt() {
        this._ws.send(JSON.stringify({ type: 'interrupt' }));
      }

      _errorMsg(key) {
        const msg = this._errors[key];
        return msg ? html`<p class="field-error">${msg}</p>` : '';
      }

      _renderField(f, errorKey) {
        const eKey = errorKey ?? f.name;
        const err = this._errors[eKey];
        const value = this._signals.get(f.name)?.get() ?? '';
        const onInput = (e) => this._onInput(f.name, e.target.value, eKey);

        switch (f.type) {
          case 'textarea':
            return html`
              <div class="field">
                <label for=${f.name}>${f.label}</label>
                <textarea
                  id=${f.name}
                  class=${err ? 'input-error' : ''}
                  placeholder=${f.placeholder ?? ''}
                  .value=${value}
                  @input=${onInput}
                  ?disabled=${this._submitted}
                ></textarea>
                ${this._errorMsg(eKey)}
              </div>`;

          case 'number':
            return html`
              <div class="field">
                <label for=${f.name}>${f.label}</label>
                <input
                  type="number"
                  id=${f.name}
                  class=${err ? 'input-error' : ''}
                  placeholder=${f.placeholder ?? ''}
                  .value=${value}
                  @input=${onInput}
                  ?disabled=${this._submitted}
                />
                ${this._errorMsg(eKey)}
              </div>`;

          case 'select':
            return html`
              <div class="field">
                <label for=${f.name}>${f.label}</label>
                <select
                  id=${f.name}
                  class=${err ? 'input-error' : ''}
                  .value=${value}
                  @change=${onInput}
                  ?disabled=${this._submitted}
                >
                  <option value="">— choose —</option>
                  ${(f.options ?? []).map(
                    (o) => html`<option value=${o} ?selected=${value === o}>${o}</option>`
                  )}
                </select>
                ${this._errorMsg(eKey)}
              </div>`;

          case 'checkbox': {
            const checked = value === 'true';
            return html`
              <div class="field">
                <div class="checkbox-row">
                  <input
                    type="checkbox"
                    id=${f.name}
                    .checked=${checked}
                    @change=${(e) => this._onInput(f.name, String(e.target.checked), eKey)}
                    ?disabled=${this._submitted}
                  />
                  <label for=${f.name}>${f.label}</label>
                </div>
                ${this._errorMsg(eKey)}
              </div>`;
          }

          case 'radio':
            return html`
              <div class="field">
                <label>${f.label}</label>
                <div class="radio-group">
                  ${(f.options ?? []).map((o) => html`
                    <div class="radio-row">
                      <input
                        type="radio"
                        id=${`${f.name}_${o}`}
                        name=${f.name}
                        value=${o}
                        .checked=${value === o}
                        @change=${() => this._onInput(f.name, o, eKey)}
                        ?disabled=${this._submitted}
                      />
                      <label for=${`${f.name}_${o}`}>${o}</label>
                    </div>
                  `)}
                </div>
                ${this._errorMsg(eKey)}
              </div>`;

          case 'date':
            return html`
              <div class="field">
                <label for=${f.name}>${f.label}</label>
                <input
                  type="date"
                  id=${f.name}
                  class=${err ? 'input-error' : ''}
                  .value=${value}
                  @change=${onInput}
                  ?disabled=${this._submitted}
                />
                ${this._errorMsg(eKey)}
              </div>`;

          case 'datetime':
            return html`
              <div class="field">
                <label for=${f.name}>${f.label}</label>
                <input
                  type="datetime-local"
                  id=${f.name}
                  class=${err ? 'input-error' : ''}
                  .value=${value}
                  @change=${onInput}
                  ?disabled=${this._submitted}
                />
                ${this._errorMsg(eKey)}
              </div>`;

          case 'range': {
            const min = f.min ?? 0;
            const max = f.max ?? 100;
            const step = f.step ?? 1;
            const numVal = value !== '' ? value : String(min);
            return html`
              <div class="field">
                <label for=${f.name}>${f.label}</label>
                <div class="range-wrap">
                  <input
                    type="range"
                    id=${f.name}
                    min=${min}
                    max=${max}
                    step=${step}
                    .value=${numVal}
                    @input=${(e) => this._onInput(f.name, e.target.value)}
                    ?disabled=${this._submitted}
                  />
                  <span class="range-value">${numVal}</span>
                </div>
              </div>`;
          }

          case 'multiselect': {
            let selected;
            try { selected = JSON.parse(value || '[]'); } catch { selected = []; }
            if (!Array.isArray(selected)) selected = [];
            const toggle = (o) => {
              const next = selected.includes(o)
                ? selected.filter((x) => x !== o)
                : [...selected, o];
              this._onInput(f.name, JSON.stringify(next), eKey);
            };
            return html`
              <div class="field">
                <label>${f.label}</label>
                <div class="multiselect-group">
                  ${(f.options ?? []).map((o) => html`
                    <div class="multiselect-row">
                      <input
                        type="checkbox"
                        id=${`${f.name}_${o}`}
                        .checked=${selected.includes(o)}
                        @change=${() => toggle(o)}
                        ?disabled=${this._submitted}
                      />
                      <label for=${`${f.name}_${o}`}>${o}</label>
                    </div>
                  `)}
                </div>
                ${this._errorMsg(eKey)}
              </div>`;
          }

          case 'file': {
            const fs = this._fileState?.get(f.name) ?? { status: 'idle', fileName: '' };
            const isDone = fs.status === 'done';
            const isUploading = fs.status === 'uploading';
            const disabled = this._submitted || isUploading;
            const dropClass = [
              'file-drop',
              isDone ? 'file-drop--done' : '',
              disabled ? 'file-drop--disabled' : '',
            ].filter(Boolean).join(' ');

            const onFileChange = (e) => {
              const file = e.target.files?.[0];
              if (file) this._uploadFile(f.name, file);
            };
            const onDragOver = (e) => { e.preventDefault(); e.currentTarget.classList.add('file-drop--over'); };
            const onDragLeave = (e) => { e.currentTarget.classList.remove('file-drop--over'); };
            const onDrop = (e) => {
              e.preventDefault();
              e.currentTarget.classList.remove('file-drop--over');
              const file = e.dataTransfer.files?.[0];
              if (file && !disabled) this._uploadFile(f.name, file);
            };

            return html`
              <div class="field">
                <label>${f.label}</label>
                <div
                  class=${dropClass}
                  @dragover=${onDragOver}
                  @dragleave=${onDragLeave}
                  @drop=${onDrop}
                >
                  ${!disabled ? html`
                    <input
                      type="file"
                      accept=${f.accept ?? ''}
                      @change=${onFileChange}
                    />` : ''}
                  <div class="file-drop__icon">${isDone ? '✓' : '📎'}</div>
                  ${isDone
                    ? html`<div class="file-drop__name">${fs.fileName}</div>`
                    : isUploading
                      ? html`<div class="file-drop__uploading">Uploading ${fs.fileName}…</div>`
                      : html`<div class="file-drop__prompt">Click or drag a file here</div>`}
                </div>
              </div>`;
          }

          case 'list': {
            const subFields = f.fields ?? [];
            const emptyRow = () => Object.fromEntries(subFields.map((sf) => [sf.name, sf.default ?? '']));

            let rows;
            try { rows = JSON.parse(value || '[]'); } catch { rows = []; }
            if (!Array.isArray(rows) || rows.length === 0) rows = [emptyRow()];

            const updateRow = (idx, fieldName, val, sfErrKey) => {
              const next = rows.map((r, i) => i === idx ? { ...r, [fieldName]: val } : r);
              this._onInput(f.name, JSON.stringify(next), sfErrKey);
            };
            const addRow = () => {
              this._onInput(f.name, JSON.stringify([...rows, emptyRow()]));
            };
            const removeRow = (idx) => {
              const next = rows.filter((_, i) => i !== idx);
              this._onInput(f.name, JSON.stringify(next.length ? next : [emptyRow()]));
              // clear all errors for this row
              const prefix = `${f.name}[${idx}].`;
              const cleaned = Object.fromEntries(Object.entries(this._errors).filter(([k]) => !k.startsWith(prefix)));
              this._errors = cleaned;
            };

            const renderSubField = (sf, rowIdx, rowVal) => {
              const sfErrKey = `${f.name}[${rowIdx}].${sf.name}`;
              const sfErr = this._errors[sfErrKey];
              const val = rowVal[sf.name] ?? sf.default ?? '';
              const upd = (v) => updateRow(rowIdx, sf.name, v, sfErrKey);
              const errMsg = sfErr ? html`<p class="field-error">${sfErr}</p>` : '';
              const ec = sfErr ? 'input-error' : '';

              switch (sf.type) {
                case 'textarea':
                  return html`<div class="field">
                    <label>${sf.label}</label>
                    <textarea class=${ec} placeholder=${sf.placeholder ?? ''} .value=${val}
                      @input=${(e) => upd(e.target.value)} ?disabled=${this._submitted}></textarea>
                    ${errMsg}
                  </div>`;
                case 'number':
                  return html`<div class="field">
                    <label>${sf.label}</label>
                    <input type="number" class=${ec} placeholder=${sf.placeholder ?? ''} .value=${val}
                      @input=${(e) => upd(e.target.value)} ?disabled=${this._submitted} />
                    ${errMsg}
                  </div>`;
                case 'select':
                  return html`<div class="field">
                    <label>${sf.label}</label>
                    <select class=${ec} .value=${val} @change=${(e) => upd(e.target.value)} ?disabled=${this._submitted}>
                      <option value="">— choose —</option>
                      ${(sf.options ?? []).map((o) => html`<option value=${o} ?selected=${val === o}>${o}</option>`)}
                    </select>
                    ${errMsg}
                  </div>`;
                case 'checkbox': {
                  const checked = val === 'true';
                  return html`<div class="field">
                    <div class="checkbox-row">
                      <input type="checkbox" .checked=${checked}
                        @change=${(e) => upd(String(e.target.checked))} ?disabled=${this._submitted} />
                      <label>${sf.label}</label>
                    </div>
                    ${errMsg}
                  </div>`;
                }
                case 'radio':
                  return html`<div class="field">
                    <label>${sf.label}</label>
                    <div class="radio-group">
                      ${(sf.options ?? []).map((o) => html`
                        <div class="radio-row">
                          <input type="radio" name=${`${f.name}_${rowIdx}_${sf.name}`} value=${o}
                            .checked=${val === o} @change=${() => upd(o)} ?disabled=${this._submitted} />
                          <label>${o}</label>
                        </div>`)}
                    </div>
                    ${errMsg}
                  </div>`;
                case 'date':
                  return html`<div class="field">
                    <label>${sf.label}</label>
                    <input type="date" class=${ec} .value=${val} @change=${(e) => upd(e.target.value)} ?disabled=${this._submitted} />
                    ${errMsg}
                  </div>`;
                case 'datetime':
                  return html`<div class="field">
                    <label>${sf.label}</label>
                    <input type="datetime-local" class=${ec} .value=${val} @change=${(e) => upd(e.target.value)} ?disabled=${this._submitted} />
                    ${errMsg}
                  </div>`;
                case 'range': {
                  const min = sf.min ?? 0; const max = sf.max ?? 100; const step = sf.step ?? 1;
                  const num = val !== '' ? val : String(min);
                  return html`<div class="field">
                    <label>${sf.label}</label>
                    <div class="range-wrap">
                      <input type="range" min=${min} max=${max} step=${step} .value=${num}
                        @input=${(e) => upd(e.target.value)} ?disabled=${this._submitted} />
                      <span class="range-value">${num}</span>
                    </div>
                    ${errMsg}
                  </div>`;
                }
                case 'multiselect': {
                  let sel; try { sel = JSON.parse(val || '[]'); } catch { sel = []; }
                  if (!Array.isArray(sel)) sel = [];
                  const toggle = (o) => {
                    const next = sel.includes(o) ? sel.filter((x) => x !== o) : [...sel, o];
                    upd(JSON.stringify(next));
                  };
                  return html`<div class="field">
                    <label>${sf.label}</label>
                    <div class="multiselect-group">
                      ${(sf.options ?? []).map((o) => html`
                        <div class="multiselect-row">
                          <input type="checkbox" .checked=${sel.includes(o)}
                            @change=${() => toggle(o)} ?disabled=${this._submitted} />
                          <label>${o}</label>
                        </div>`)}
                    </div>
                    ${errMsg}
                  </div>`;
                }
                case 'color': {
                  const cv = val || '#000000';
                  return html`<div class="field">
                    <label>${sf.label}</label>
                    <div class="color-wrap">
                      <input type="color" .value=${cv}
                        @input=${(e) => upd(e.target.value)} ?disabled=${this._submitted} />
                      <span class="color-hex">${cv}</span>
                    </div>
                    ${errMsg}
                  </div>`;
                }
                default: // text
                  return html`<div class="field">
                    <label>${sf.label}</label>
                    <input type="text" class=${ec} placeholder=${sf.placeholder ?? ''} .value=${val}
                      @input=${(e) => upd(e.target.value)} ?disabled=${this._submitted} />
                    ${errMsg}
                  </div>`;
              }
            };

            const cardHasError = (idx) =>
              subFields.some((sf) => this._errors[`${f.name}[${idx}].${sf.name}`]);

            return html`
              <div class="field">
                <label>${f.label}</label>
                ${this._errorMsg(f.name)}
                <div class="list-rows">
                  ${rows.map((rowVal, idx) => html`
                    <div class="list-card ${cardHasError(idx) ? 'card-has-error' : ''}">
                      ${rows.length > 1 ? html`
                        <div class="list-card__header">
                          <span class="list-card__title">${f.itemLabel ?? `Item ${idx + 1}`}</span>
                          <button type="button" class="list-card__remove" title="Remove"
                            ?disabled=${this._submitted} @click=${() => removeRow(idx)}>✕</button>
                        </div>` : ''}
                      <div class="list-card__body">
                        ${subFields.map((sf) => renderSubField(sf, idx, rowVal))}
                      </div>
                    </div>`)}
                  ${!this._submitted ? html`
                    <button type="button" class="list-add-btn" @click=${addRow}>
                      + Add another
                    </button>` : ''}
                </div>
              </div>`;
          }

          case 'color': {
            const colorVal = value || '#000000';
            return html`
              <div class="field">
                <label for=${f.name}>${f.label}</label>
                <div class="color-wrap">
                  <input
                    type="color"
                    id=${f.name}
                    .value=${colorVal}
                    @input=${(e) => this._onInput(f.name, e.target.value, eKey)}
                    ?disabled=${this._submitted}
                  />
                  <span class="color-hex">${colorVal}</span>
                </div>
                ${this._errorMsg(eKey)}
              </div>`;
          }

          case 'html_output':
            return html`
              <html-output-block
                .content=${f.html ?? ''}
                .scopedCss=${f.css ?? ''}
              ></html-output-block>`;

          default: // text
            return html`
              <div class="field">
                <label for=${f.name}>${f.label}</label>
                <input
                  type="text"
                  id=${f.name}
                  class=${err ? 'input-error' : ''}
                  placeholder=${f.placeholder ?? ''}
                  .value=${value}
                  @input=${onInput}
                  ?disabled=${this._submitted}
                />
                ${this._errorMsg(eKey)}
              </div>`;
        }
      }

      render() {
        return html`
          ${this._title ? html`<p class="title">${this._title}</p>` : ''}

          ${this._fields.map((f) => this._renderField(f))}

          ${this._fields.length > 0 ? html`
            <div class="actions">
              <button @click=${this._onSubmit} ?disabled=${this._submitted}>
                ${this._submitted ? 'Submitted' : 'Submit'}
              </button>
              ${this._submitted
                ? html`<span class="submitted-note">Sent — waiting for agent…</span>`
                : ''}
            </div>
          ` : ''}

          <div class="status" style="margin-top: 1rem;">
            <span class="dot ${this._connected ? 'live' : ''}"></span>
            ${this._connected ? 'connected' : 'reconnecting…'}
          </div>
        `;
      }
    }

    customElements.define('mcp-form', McpForm);
  </script>
</body>
</html>
