<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MCP Form</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f0;
    }
    mcp-form {
      background: white;
      padding: 2rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      min-width: 340px;
      max-width: 480px;
      width: 100%;
    }
  </style>
</head>
<body>
  <mcp-form></mcp-form>

  <script type="module">
    import { LitElement, html, css } from 'https://esm.sh/lit@3';

    class Signal {
      #value;
      #subs = new Set();
      constructor(initial) { this.#value = initial; }
      get() { return this.#value; }
      set(next) {
        if (next === this.#value) return;
        this.#value = next;
        for (const fn of this.#subs) fn(next);
      }
      subscribe(fn) { this.#subs.add(fn); return () => this.#subs.delete(fn); }
    }

    class McpForm extends LitElement {
      static styles = css`
        :host { display: block; }

        .title {
          font-size: 1.1rem;
          font-weight: 600;
          color: #1a1a1a;
          margin: 0 0 1.5rem;
          line-height: 1.4;
        }

        .field { margin-bottom: 1.1rem; }

        label {
          display: block;
          font-size: 0.78rem;
          font-weight: 500;
          color: #555;
          margin-bottom: 0.3rem;
          letter-spacing: 0.01em;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="datetime-local"],
        textarea,
        select {
          font-family: inherit;
          font-size: 0.95rem;
          padding: 0.5rem 0.7rem;
          border: 1px solid #ddd;
          border-radius: 6px;
          width: 100%;
          outline: none;
          background: #fff;
          color: #1a1a1a;
          transition: border-color 0.15s;
        }
        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        input[type="datetime-local"]:focus,
        textarea:focus,
        select:focus { border-color: #666; }

        textarea { resize: vertical; min-height: 80px; }

        .checkbox-row {
          display: flex;
          align-items: center;
          gap: 0.55rem;
          padding: 0.3rem 0;
        }
        .checkbox-row input[type="checkbox"] {
          width: 1.1rem;
          height: 1.1rem;
          margin: 0;
          cursor: pointer;
          accent-color: #1a1a1a;
          flex-shrink: 0;
        }
        .checkbox-row label {
          margin: 0;
          font-size: 0.9rem;
          font-weight: 400;
          color: #1a1a1a;
          cursor: pointer;
        }

        .radio-group {
          display: flex;
          flex-direction: column;
          gap: 0.45rem;
          padding: 0.1rem 0;
        }
        .radio-row {
          display: flex;
          align-items: center;
          gap: 0.55rem;
        }
        .radio-row input[type="radio"] {
          width: 1rem;
          height: 1rem;
          margin: 0;
          cursor: pointer;
          accent-color: #1a1a1a;
          flex-shrink: 0;
        }
        .radio-row label {
          margin: 0;
          font-size: 0.9rem;
          font-weight: 400;
          color: #1a1a1a;
          cursor: pointer;
        }

        .range-wrap {
          display: flex;
          align-items: center;
          gap: 0.75rem;
        }
        input[type="range"] {
          flex: 1;
          accent-color: #1a1a1a;
          cursor: pointer;
        }
        .range-value {
          font-size: 0.9rem;
          font-weight: 600;
          color: #1a1a1a;
          min-width: 2.5rem;
          text-align: right;
        }

        .multiselect-group {
          display: flex;
          flex-direction: column;
          gap: 0.45rem;
          padding: 0.1rem 0;
        }
        .multiselect-row {
          display: flex;
          align-items: center;
          gap: 0.55rem;
        }
        .multiselect-row input[type="checkbox"] {
          width: 1rem;
          height: 1rem;
          margin: 0;
          cursor: pointer;
          accent-color: #1a1a1a;
          flex-shrink: 0;
        }
        .multiselect-row label {
          margin: 0;
          font-size: 0.9rem;
          font-weight: 400;
          color: #1a1a1a;
          cursor: pointer;
        }

        .file-drop {
          border: 2px dashed #ddd;
          border-radius: 8px;
          padding: 1.2rem 1rem;
          text-align: center;
          cursor: pointer;
          transition: border-color 0.15s, background 0.15s;
          position: relative;
        }
        .file-drop:hover:not(.file-drop--disabled) { border-color: #999; background: #fafafa; }
        .file-drop--over { border-color: #1a1a1a; background: #f0f0f0; }
        .file-drop--done { border-color: #4caf50; background: #f6fff6; cursor: default; }
        .file-drop--disabled { opacity: 0.5; cursor: not-allowed; }
        .file-drop input[type="file"] {
          position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
        }
        .file-drop--disabled input[type="file"] { pointer-events: none; }
        .file-drop__icon { font-size: 1.5rem; margin-bottom: 0.3rem; }
        .file-drop__prompt { font-size: 0.85rem; color: #666; }
        .file-drop__name { font-size: 0.85rem; font-weight: 600; color: #1a1a1a; margin-top: 0.2rem; }
        .file-drop__uploading { font-size: 0.78rem; color: #aaa; margin-top: 0.2rem; }

        .actions {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-top: 1.5rem;
          gap: 1rem;
        }

        button {
          font-family: inherit;
          font-size: 0.9rem;
          font-weight: 600;
          padding: 0.55rem 1.4rem;
          border: none;
          border-radius: 6px;
          cursor: pointer;
          background: #1a1a1a;
          color: #fff;
          transition: opacity 0.15s, background 0.15s;
        }
        button:hover:not(:disabled) { background: #333; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .submitted-note {
          font-size: 0.78rem;
          color: #4caf50;
          font-weight: 500;
        }

        .status {
          font-size: 0.72rem;
          color: #aaa;
        }
        .dot {
          display: inline-block;
          width: 7px; height: 7px;
          border-radius: 50%;
          margin-right: 4px;
          background: #ccc;
          vertical-align: middle;
        }
        .dot.live { background: #4caf50; }
      `;

      static properties = {
        _title:     { state: true },
        _fields:    { state: true },
        _connected: { state: true },
        _submitted: { state: true },
      };

      constructor() {
        super();
        this._title     = '';
        this._fields    = [];
        this._signals   = new Map();
        this._connected = false;
        this._submitted = false;
        this._connect();
      }

      _connect() {
        const ws = new WebSocket(`ws://${location.host}/ws`);
        this._ws = ws;
        ws.onopen  = () => { this._connected = true; };
        ws.onclose = () => {
          this._connected = false;
          // simple reconnect after 2 s
          setTimeout(() => this._connect(), 2000);
        };
        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === 'init' || msg.type === 'reinit') {
            this._applyFormDef(msg.formDef, msg.state);
          }
          if (msg.type === 'update') {
            const signal = this._signals.get(msg.field);
            if (signal) signal.set(msg.value);
          }
        };
      }

      _applyFormDef(formDef, state) {
        this._title    = formDef.title ?? '';
        this._fields   = formDef.fields;
        this._submitted = false;
        this._signals  = new Map();
        this._fileState = new Map(); // name -> { status: 'idle'|'uploading'|'done'|'error', fileName }
        for (const f of this._fields) {
          const signal = new Signal(state[f.name] ?? f.default ?? '');
          signal.subscribe(() => this.requestUpdate());
          this._signals.set(f.name, signal);
          if (f.type === 'file') this._fileState.set(f.name, { status: 'idle', fileName: '' });
        }
        this.requestUpdate();
      }

      _onInput(name, value) {
        this._signals.get(name)?.set(value);
        this._ws.send(JSON.stringify({ type: 'set', field: name, value }));
      }

      async _uploadFile(name, file) {
        this._fileState.set(name, { status: 'uploading', fileName: file.name });
        this.requestUpdate();

        try {
          const fd = new FormData();
          fd.append('file', file);
          const res = await fetch('/upload', { method: 'POST', body: fd });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const { path } = await res.json();
          this._fileState.set(name, { status: 'done', fileName: file.name });
          this._onInput(name, path);
        } catch (err) {
          this._fileState.set(name, { status: 'error', fileName: file.name });
        }
        this.requestUpdate();
      }

      _onSubmit() {
        this._submitted = true;
        this._ws.send(JSON.stringify({ type: 'submit' }));
      }

      _renderField(f) {
        const value = this._signals.get(f.name)?.get() ?? '';
        const onInput = (e) => this._onInput(f.name, e.target.value);

        switch (f.type) {
          case 'textarea':
            return html`
              <div class="field">
                <label for=${f.name}>${f.label}</label>
                <textarea
                  id=${f.name}
                  placeholder=${f.placeholder ?? ''}
                  .value=${value}
                  @input=${onInput}
                  ?disabled=${this._submitted}
                ></textarea>
              </div>`;

          case 'number':
            return html`
              <div class="field">
                <label for=${f.name}>${f.label}</label>
                <input
                  type="number"
                  id=${f.name}
                  placeholder=${f.placeholder ?? ''}
                  .value=${value}
                  @input=${onInput}
                  ?disabled=${this._submitted}
                />
              </div>`;

          case 'select':
            return html`
              <div class="field">
                <label for=${f.name}>${f.label}</label>
                <select
                  id=${f.name}
                  .value=${value}
                  @change=${onInput}
                  ?disabled=${this._submitted}
                >
                  <option value="">— choose —</option>
                  ${(f.options ?? []).map(
                    (o) => html`<option value=${o} ?selected=${value === o}>${o}</option>`
                  )}
                </select>
              </div>`;

          case 'checkbox': {
            const checked = value === 'true';
            return html`
              <div class="field">
                <div class="checkbox-row">
                  <input
                    type="checkbox"
                    id=${f.name}
                    .checked=${checked}
                    @change=${(e) => this._onInput(f.name, String(e.target.checked))}
                    ?disabled=${this._submitted}
                  />
                  <label for=${f.name}>${f.label}</label>
                </div>
              </div>`;
          }

          case 'radio':
            return html`
              <div class="field">
                <label>${f.label}</label>
                <div class="radio-group">
                  ${(f.options ?? []).map((o) => html`
                    <div class="radio-row">
                      <input
                        type="radio"
                        id=${`${f.name}_${o}`}
                        name=${f.name}
                        value=${o}
                        .checked=${value === o}
                        @change=${() => this._onInput(f.name, o)}
                        ?disabled=${this._submitted}
                      />
                      <label for=${`${f.name}_${o}`}>${o}</label>
                    </div>
                  `)}
                </div>
              </div>`;

          case 'date':
            return html`
              <div class="field">
                <label for=${f.name}>${f.label}</label>
                <input
                  type="date"
                  id=${f.name}
                  .value=${value}
                  @change=${onInput}
                  ?disabled=${this._submitted}
                />
              </div>`;

          case 'datetime':
            return html`
              <div class="field">
                <label for=${f.name}>${f.label}</label>
                <input
                  type="datetime-local"
                  id=${f.name}
                  .value=${value}
                  @change=${onInput}
                  ?disabled=${this._submitted}
                />
              </div>`;

          case 'range': {
            const min = f.min ?? 0;
            const max = f.max ?? 100;
            const step = f.step ?? 1;
            const numVal = value !== '' ? value : String(min);
            return html`
              <div class="field">
                <label for=${f.name}>${f.label}</label>
                <div class="range-wrap">
                  <input
                    type="range"
                    id=${f.name}
                    min=${min}
                    max=${max}
                    step=${step}
                    .value=${numVal}
                    @input=${(e) => this._onInput(f.name, e.target.value)}
                    ?disabled=${this._submitted}
                  />
                  <span class="range-value">${numVal}</span>
                </div>
              </div>`;
          }

          case 'multiselect': {
            let selected;
            try { selected = JSON.parse(value || '[]'); } catch { selected = []; }
            if (!Array.isArray(selected)) selected = [];
            const toggle = (o) => {
              const next = selected.includes(o)
                ? selected.filter((x) => x !== o)
                : [...selected, o];
              this._onInput(f.name, JSON.stringify(next));
            };
            return html`
              <div class="field">
                <label>${f.label}</label>
                <div class="multiselect-group">
                  ${(f.options ?? []).map((o) => html`
                    <div class="multiselect-row">
                      <input
                        type="checkbox"
                        id=${`${f.name}_${o}`}
                        .checked=${selected.includes(o)}
                        @change=${() => toggle(o)}
                        ?disabled=${this._submitted}
                      />
                      <label for=${`${f.name}_${o}`}>${o}</label>
                    </div>
                  `)}
                </div>
              </div>`;
          }

          case 'file': {
            const fs = this._fileState?.get(f.name) ?? { status: 'idle', fileName: '' };
            const isDone = fs.status === 'done';
            const isUploading = fs.status === 'uploading';
            const disabled = this._submitted || isUploading;
            const dropClass = [
              'file-drop',
              isDone ? 'file-drop--done' : '',
              disabled ? 'file-drop--disabled' : '',
            ].filter(Boolean).join(' ');

            const onFileChange = (e) => {
              const file = e.target.files?.[0];
              if (file) this._uploadFile(f.name, file);
            };
            const onDragOver = (e) => { e.preventDefault(); e.currentTarget.classList.add('file-drop--over'); };
            const onDragLeave = (e) => { e.currentTarget.classList.remove('file-drop--over'); };
            const onDrop = (e) => {
              e.preventDefault();
              e.currentTarget.classList.remove('file-drop--over');
              const file = e.dataTransfer.files?.[0];
              if (file && !disabled) this._uploadFile(f.name, file);
            };

            return html`
              <div class="field">
                <label>${f.label}</label>
                <div
                  class=${dropClass}
                  @dragover=${onDragOver}
                  @dragleave=${onDragLeave}
                  @drop=${onDrop}
                >
                  ${!disabled ? html`
                    <input
                      type="file"
                      accept=${f.accept ?? ''}
                      @change=${onFileChange}
                    />` : ''}
                  <div class="file-drop__icon">${isDone ? '✓' : '📎'}</div>
                  ${isDone
                    ? html`<div class="file-drop__name">${fs.fileName}</div>`
                    : isUploading
                      ? html`<div class="file-drop__uploading">Uploading ${fs.fileName}…</div>`
                      : html`<div class="file-drop__prompt">Click or drag a file here</div>`}
                </div>
              </div>`;
          }

          default: // text
            return html`
              <div class="field">
                <label for=${f.name}>${f.label}</label>
                <input
                  type="text"
                  id=${f.name}
                  placeholder=${f.placeholder ?? ''}
                  .value=${value}
                  @input=${onInput}
                  ?disabled=${this._submitted}
                />
              </div>`;
        }
      }

      render() {
        return html`
          ${this._title ? html`<p class="title">${this._title}</p>` : ''}

          ${this._fields.map((f) => this._renderField(f))}

          ${this._fields.length > 0 ? html`
            <div class="actions">
              <button @click=${this._onSubmit} ?disabled=${this._submitted}>
                ${this._submitted ? 'Submitted' : 'Submit'}
              </button>
              ${this._submitted
                ? html`<span class="submitted-note">Sent — waiting for agent…</span>`
                : ''}
            </div>
          ` : ''}

          <div class="status" style="margin-top: 1rem;">
            <span class="dot ${this._connected ? 'live' : ''}"></span>
            ${this._connected ? 'connected' : 'reconnecting…'}
          </div>
        `;
      }
    }

    customElements.define('mcp-form', McpForm);
  </script>
</body>
</html>
