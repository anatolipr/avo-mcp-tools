<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hello World</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 4rem auto;
      padding: 0 1.5rem;
    }
  </style>
</head>
<body>
  <!--
    This page has zero build-step dependency on mcp-tenant-server or
    js-bridge-mcp. It defines its own functions and its own tool manifest
    below, in plain JS, before any bridge script exists. An MCP agent
    connected to js-bridge-mcp will call the get_embed_snippet tool, which
    returns one line of executable JS — paste it into this page's DevTools
    console and press enter (no source edit needed), or wrap it in a
    <script type="module">...</script> tag right here if you'd rather bake
    it into the page's HTML. Either way, once it runs, it reads
    window.__mcpTools (defined below) and registers those tools with the
    MCP server — the server never hardcodes them.
  -->
  <h1>Hello, world!</h1>
  <main>Waiting for an agent to say something...</main>

  <script>
    function insertTitle({ title }) {
      document.title = title;
      document.querySelector('h1').textContent = title;
      return `title set to "${title}"`;
    }

    function insertMain({ main }) {
      document.querySelector('main').textContent = main;
      return 'main content updated';
    }

    // window.__mcpTools is the contract the injected bridge script looks
    // for: an array of { name, description, params, example, fn } — real
    // function references, not string lookups. Any page wiring itself up
    // to js-bridge-mcp defines this the same way, in its own script.
    window.__mcpTools = [
      {
        name: 'insert_title',
        description: 'Sets the <h1> title shown on this page.',
        params: { title: { type: 'string', description: 'New page title' } },
        example: { title: 'Welcome, Ada!' },
        fn: insertTitle,
      },
      {
        name: 'insert_main',
        description: 'Sets the <main> body content shown on this page.',
        params: { main: { type: 'string', description: 'New body text' } },
        example: { main: 'Here is your daily summary...' },
        fn: insertMain,
      },
    ];
  </script>

  <!-- Or paste the snippet from get_embed_snippet here, wrapped in a <script type="module"> tag -->
</body>
</html>
