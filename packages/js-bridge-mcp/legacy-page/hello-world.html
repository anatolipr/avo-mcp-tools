<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hello World</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 4rem auto;
      padding: 0 1.5rem;
    }
  </style>
</head>
<body>
  <!--
    This page has zero build-step dependency on mcp-tenant-server or
    js-bridge-mcp. An MCP agent connected to js-bridge-mcp will call the
    get_embed_snippet tool, which returns one line of executable JS —
    paste it into this page's DevTools console and press enter (no source
    edit needed), or wrap it in a <script type="module">...</script> tag
    right here if you'd rather bake it into the page's HTML. Either way,
    once it runs, the tools declared below become available to the agent —
    the server discovers them from this JSON, it does not hardcode them.
  -->
  <h1>Hello, world!</h1>
  <main>Waiting for an agent to say something...</main>

  <script id="mcp-tools" type="application/json">
  [
    {
      "name": "insert_title",
      "description": "Sets the <h1> title shown on this page.",
      "target": "insertTitle",
      "params": { "title": { "type": "string", "description": "New page title" } },
      "example": { "title": "Welcome, Ada!" }
    },
    {
      "name": "insert_main",
      "description": "Sets the <main> body content shown on this page.",
      "target": "insertMain",
      "params": { "main": { "type": "string", "description": "New body text" } },
      "example": { "main": "Here is your daily summary..." }
    }
  ]
  </script>

  <!-- Or paste the snippet from get_embed_snippet here, wrapped in a <script type="module"> tag -->
</body>
</html>
