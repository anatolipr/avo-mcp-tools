<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>js-bridge-mcp Connector</title>
    <style>
      /* Resets the browser's default 8px body margin, which otherwise shows
         through as a light-colored border around popup-app's own dark-themed
         Shadow DOM background. color-scheme here (not just inside popup-app)
         is what makes that gap itself render dark instead of white before
         popup-app's background paints over it. */
      html, body {
        margin: 0;
        padding: 0;
        color-scheme: light dark;
      }
    </style>
  </head>
  <body>
    <popup-app></popup-app>
    <script type="module" src="popup.js"></script>
  </body>
</html>
