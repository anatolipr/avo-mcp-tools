<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>screenmarker</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#007aff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="screenmarker" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    :root {
      color-scheme: light dark;
      --bg: light-dark(#f5f5f0, #17181a);
      --panel: light-dark(#ffffff, #232427);
      --border: light-dark(#d8d8d2, #3a3b3e);
      --text: light-dark(#1a1a1a, #f0f0f0);
      --accent: light-dark(#007aff, #007aff);
    }
    :root[data-theme='light'] { color-scheme: light; }
    :root[data-theme='dark']  { color-scheme: dark; }
  </style>
</head>
<body>
  <screen-marker></screen-marker>

  <script type="module" src="../src/client/main.ts"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</body>
</html>
